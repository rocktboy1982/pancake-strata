/* Layout: header with status counts, tab bar (plan items / tests / full plan), filter row, then a single column of rows. */
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --fg: #1b1f27;
  --muted: #5d6676;
  --line: #dde1e8;
  --accent: #b3262f;
  --accent-soft: #f7e4e5;
  --code-bg: #eef0f4;
  --s-done: #1f7a4d;
  --s-progress: #1d5fb8;
  --s-queued: #6b4fb3;
  --s-notstarted: #5d6676;
  --s-waiting: #9a6a00;
  --s-fix: #b3262f;
  --s-parked: #7a7f88;
  --s-dropped: #8a5a44;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #191d25; --fg: #e4e7ee; --muted: #9aa3b4; --line: #2b313d;
    --accent: #ff6f78; --accent-soft: #3a1f24; --code-bg: #222834;
    --s-done: #5cc98f; --s-progress: #6fa8ff; --s-queued: #b39cff; --s-notstarted: #9aa3b4; --s-waiting: #e2b54a;
    --s-fix: #ff6f78; --s-parked: #8d939d; --s-dropped: #d39a7f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #191d25; --fg: #e4e7ee; --muted: #9aa3b4; --line: #2b313d;
  --accent: #ff6f78; --accent-soft: #3a1f24; --code-bg: #222834;
  --s-done: #5cc98f; --s-progress: #6fa8ff; --s-queued: #b39cff; --s-notstarted: #9aa3b4; --s-waiting: #e2b54a;
  --s-fix: #ff6f78; --s-parked: #8d939d; --s-dropped: #d39a7f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 2px solid var(--fg); padding-bottom: 12px; }
header.top h1 { font: 700 clamp(24px, 4vw, 34px)/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
header.top h1 span { color: var(--accent); }
.meta { font: 12.5px/1.5 var(--font-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta b { color: var(--fg); font-weight: 500; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { display: flex; align-items: baseline; gap: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; color: var(--fg); }
.count b { font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.count span { font-size: 12.5px; color: var(--muted); }
.count:hover, .count:focus-visible { border-color: var(--accent); outline: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { font: 600 14px/1 var(--font-body); padding: 10px 14px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { font: 500 12.5px/1 var(--font-body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); display: inline-block; }
.fchip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.fchip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: var(--accent-soft); }
.fchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="search"], select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; }
input[type="search"] { flex: 1 1 240px; }
.shown { font-size: 12.5px; color: var(--muted); }
.list { display: grid; gap: 8px; }
.item { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 6px; }
.item summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; }
.item summary::-webkit-details-marker { display: none; }
.item summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.st { font: 600 11px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.ttl { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.sec { font-size: 12px; color: var(--muted); white-space: nowrap; }
.body { padding: 0 14px 12px 14px; color: var(--fg); overflow-wrap: anywhere; border-top: 1px dashed var(--line); padding-top: 10px; }
.body p { margin: 0 0 6px; }
code { font: 0.88em/1.4 var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.tid { font: 500 0.85em/1 var(--font-mono); color: var(--accent); background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--line); }
th { font: 600 11.5px/1.3 var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--code-bg); position: sticky; top: 0; white-space: nowrap; }
td.id { font-family: var(--font-mono); white-space: nowrap; color: var(--accent); }
td.v { white-space: nowrap; font-weight: 600; font-size: 11.5px; letter-spacing: 0.04em; }
td.res { min-width: 320px; }
td.item-c { min-width: 200px; }
td.arch { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); min-width: 180px; overflow-wrap: anywhere; }
.plan { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 22px 24px; min-width: 0; }
.plan h1 { display: none; }
.plan h2 { font: 600 21px/1.25 var(--font-display); margin: 30px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.plan h2:first-of-type { border-top: none; }
.plan p, .plan li { max-width: 82ch; }
.plan .tbl { overflow-x: auto; margin: 12px 0; }
.plan table td { min-width: 90px; }
.plan pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.plan pre code { background: none; padding: 0; overflow-wrap: normal; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 6px; }
@media (max-width: 640px) {
  .item summary { grid-template-columns: 1fr; }
  .sec { white-space: normal; }
}
</style>

tor (ENGINE, WORKLOAD). Combine the four admission signals that each won or showed headroom alone into one score per expert: learned profile (+6.7%, T-194), GPU router lookahead (+10%, T-192), prompt-fed counts `STRATA_ADAPT_PROMPT` (oracle +2.9 hit points offline, T-417), conversation working set `STRATA_CONV_WORKSET` (offline 81.17 -> 82.86%, T-398). REGIME CAVEAT 2026-11-16 (T-627): the served tier hit rate is about 0.91 (agent-like turns p50 0.92), the offline trace the simulator uses gives 0.81 for the tier, so a policy that wins offline may win less in production. CORRECTION 2026-11-16 (T-625): the T-618..T-621 policies other than the tier ran UNCAPPED (the tier at 32 swaps a window like the preset); at the same cap of 32 kmiss 2/4 and 2/8 equal the tier (18.43 / 18.33 vs 18.46 ms), so no rule beat the count tier offline at equal cost, and the lever left is the swap cap itself (spec 117, chain 16). Prior offline result to beat (T-408, T-409, T-426, `tools/pancake/cache_learn.py`, A46 rule: a learned policy must beat k-th miss by >= 5 hit points held out): Hawkeye / imitation gained only +1.0 hit point over k-th miss (whole trace, -7.6% on the interleaved agent trace, DROPPED), while the oracles (`opt`, `label`) reach +19.4% / +18.2% whole: the headroom is real, the past-only features were too weak. Step 0 CODED 2026-11-16 (owner idea: a static core plus empty slots that fill on demand). It needs no free-slot admission code: the owner's idea equals `STRATA_ADAPT_PROTECT=f` (the first ceil(f x slots) slots, the profile's top share, are never victims; the startup fill hands the slots out in rank order and a swap reuses the victim's slot) plus the existing tier, because a victim with count 0 is a free slot in effect, and `STRATA_ADAPT_KMISS=1,2` for admit-on-first-miss (`include/strata/program/tier_protect.hpp`, ctest `tier_protect_test`, serve `adapt()` only: the other Swap loops are untouched; ignored with per-layer admission). Offline: `tools/pancake/tier_laws.py` (all laws, `--protect`, thrash and landing-pad metrics, V1-V4 validation of item 26, law 5 as `--seed-file` seeding machinery: it cannot be simulated without prompt data), 12 tests; results T-618..T-621. Finding (offline, on this one trace): protecting a core does not lower CPU ms a window (tier 18.46 -> 18.54 / 18.23 / 18.69 ms at f 0.5 / 0.75 / 0.9, kmiss 2/8 16.89 -> 18.68 / 19.97 / 23.19), so the offline case for a fixed core is weak. Commit sets (revert point): first set X = 19b7b7f97 (tier_laws.py), b6d241e77 (STRATA_ADAPT_PROTECT), 809d6edc6 (spec 116), 6fe1107f6 (docs, T-618..T-621); upgrade Y = 806b5eae9 (tier_laws.py policy `lecar`, U2) and 4e6ce057e (`tools/pancake/tier_evolve.py`, U1) plus the docs commit that adds T-623 and T-624. Revert to X if Y is not better held out: it is NOT (T-623: evolved parameters beat only their weak same-family defaults, none beats the best hand-set rule held out, kmiss 2/4 20.03 ms/window whole, phase K16 18.63 SYNTHETIC; T-624: lecar sits between the best and worst rule), so Y adds measurement tools and no policy gain; ghost and phase were not evolved (too slow). QUEUED box test (the box runs it, not the Windows agent): spec `bench/specs/116-tier-protect.json` (base; protect 50 / 75 / 90; protect 50 / 75 + KMISS 2,4; protect 50 + KMISS 1,2) at screen, then confirm for any arm above 0. Reference offline numbers to beat (T-408: LRU 89.5%, kmiss 2/8 86.5%, tier 81.2% whole trace) are reproduced by tier_laws.py (tier 81.17%, kmiss 2/8 86.51%). The laws to try, in order: (1) break-even: admit when the expected CPU misses avoided before eviction exceed promotion cost / CPU-miss cost (about 1.2-2.4 windows at 117 us x 0.5 contention vs 48.7 us); (2) Bayesian per-expert score with the profile rank as the prior; (3) per-layer popularity fit and per-layer decay; (4) reuse-gap (survival) model; (5) cross-layer / prompt-fed signals; (6) conversation-tied prediction (item 26). So step 1 (tier 0, no GPU, extends cache_learn.py, not a new simulator): add the three signals this item combines (prompt-fed counts, conversation working set, the router lookahead's next-layer ids) as `imit` features and report the held-out gain; step 2 only if the sum is >= +3 hit points over today's tier: one switch `STRATA_TIER_SCORE`, weights from the replay, then screen / confirm CODED OFFLINE 2026-11-16 (T-669): CACHEUS-style policy (`cacheus`, `srlru`, `crlfu` in `tools/pancake/tier_laws.py`) at the T-625 rule (cap 32): 80.03% hit / 19.20 ms per window vs kmiss 2/8 81.01% / 18.33 and the tier 81.17% / 18.46 (second half 76.13 vs 77.10 vs 77.82): DROPPED, about 1 hit point worse, the regret weights stay at 0.5 / 0.5. Two-stage domain policy skipped (the repo trace has no domain labels); ARC is `ghost`, LeCaR / OLeCaR `lecar`. Regime caveat unchanged (0.81 offline vs 0.91 served, T-627).<br><b>Expected:<\/b> each hit point is one less CPU expert per ~10 routed; target the short window's 5.2 ms CPU part (exact (tier placement only))", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "notstarted", "title": "#20 R&D-B miss budget (MODEL). One controller for a missed expert instead of four separate switches: by gate-weigh...", "body": "R&D-B miss budget (MODEL). One controller for a missed expert instead of four separate switches: by gate-weight share choose CPU compute, the HotRod substitute fit (`STRATA_SUBFIT_*`, spec 99), skip (`STRATA_MISS_SKIP_W` / `_CUM`, spec 88 rerun) or the entropy tier (A29, spec 94). Step 1 (tier 0): replay a `--dump-routing` run and print, per threshold, the skipped weight share and the KL bound; step 2: `STRATA_MISS_BUDGET=<weight share>`; token forcing, then task gate. Evidence that K matters: `Q36_EXPERTS_USED=6` short +16.2%, edit +17.6% at screen (T-615); Maya +7-13% STEP 1 CODED 2026-11-16 (T-666, host-tested, engine not built): `STRATA_TIER_MISS_BUDGET=b` with `STRATA_TIER_MISS_FILE=<table>` (`include/strata/program/tier_miss_budget.hpp`; table from `python tools/pancake/gate_importance.py <dump or trace> --emit-importance FILE`): the experts with the least gate importance (per layer, cumulative share <= b) are never admitted to the serve tier and leave it first, so slots go to experts whose misses cost more output. Placement only (the missed expert still runs on the CPU), exact up to rounding; this is the tier half of the item, the CPU / substitute / skip choice by weight share is NOT coded. Spec 124 is a skeleton until a `--dump-routing` table exists from the box. No effect claimed.<br><b>Expected:<\/b> +10% decode in a separate lossy preset (lossy)", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "notstarted", "title": "#21 R&D-C window policy controller (ENGINE, WORKLOAD). The largest win so far was a per-window choice (ECAP cap 0 ...", "body": "R&D-C window policy controller (ENGINE, WORKLOAD). The largest win so far was a per-window choice (ECAP cap 0 only from 9-row windows: edit +41.7%, T-588). Extend it: per window pick the row cap, the draft source and depth (`--spec 4` vs `--lookup-chain 3`), `DRAFT_CLIP` and the lookup length from the last N windows' acceptance. Step 1 (tier 0): `STRATA_WINDOW_TRACE` on short / edit / an agent replay, then an oracle in `tools/pancake/trace/tail_replay.py` that prints the best per-window choice against the fixed preset; step 2: `STRATA_WINDOW_POLICY=1` only if the oracle headroom is >= 5% STEP 1 TOOL CODED 2026-11-16 (T-667): `tools/pancake/window_policy.py` (kept-row oracle by Dinkelbach vs the best fixed rule, tail_replay's theta rule and a causal last-N-windows controller; prints the item's 5% gate). 7 synthetic tests pass; no real window trace exists, so no number. `STRATA_WINDOW_POLICY` NOT coded: its own gate is not evaluated, and the per-window cap needs a generate.cpp change that cannot be built here. The draft source / depth choice cannot be replayed from a trace (needs an A/B arm).<br><b>Expected:<\/b> edit 175 -> 200 tok/s (exact where only drafting changes; the cap part is lossy as ECAP is (gates passed, T-589, T-591))", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "notstarted", "title": "#22 R&D-D work inside the GPU wait (KERNEL, ENGINE). combine_cpu 25.8% + wait_flag 14.8% of decode kernel time is ...", "body": "R&D-D work inside the GPU wait (KERNEL, ENGINE). combine_cpu 25.8% + wait_flag 14.8% of decode kernel time is spinning for CPU rows. Ports that move work into that wait exist one by one: `ADAPT_IDLE_COPY` (crash of T-613 not reproduced by 114a-c, section 7), `PF_AHEAD`, `LOOKAHEAD_AFTER_PUB` (dropped, T-612), `IDLE_ADAPT`. Step 1: probes 4.2.2 under rocprofv3 (section 5 item 9) to get the idle ms per window and per layer; step 2: fix T-613 from chain 13's answer; step 3: a design for the next layer's router lookahead + tier copies + the drafter's next window issued by one host pacer in the wait<br><b>Expected:<\/b> part of the 15.9 ms GPU share of a short window (exact)", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "notstarted", "title": "#23 R&D-E warm-turn pipeline (WORKLOAD). FIRST STEP DONE 2026-11-16 (`tools/pancake/turn_budget.py`, 5 tests, T-62...", "body": "R&D-E warm-turn pipeline (WORKLOAD). FIRST STEP DONE 2026-11-16 (`tools/pancake/turn_budget.py`, 5 tests, T-627): the real turn log (3,575 turns) has only 341 agent-like turns; their time is 40% prompt / 56% decode / 4% other, first token p50 0.76 s / p90 1.26 s, idle gaps mostly under 1 s (39 over 5 s in 6 days, 0.34 h of 5-300 s gaps): little recorded free time to stage in, so the premise of idle-time staging is not shown yet. One budget table for an agent turn (park, restore, re-read, prefill, tier re-warm, first window) from M1 / M2 / M5 (chain 9), then stack what exists by replay (`replay_turns.py`): conversation cache (-21.6% prompt time, T-183), `PARK_ASYNC` on HIP (spec 105), `SUFFIX_INDEX_FILE` (D4), `TIER_REWARM`, `PREFILL_EQUAL_TAIL`, `DQ_FAST`, `TOOL_IDLE_PREWARM` (spec 110). New part: read the tool response's prefix while the tool still runs and re-warm the decode tier in the same idle time SIMULATOR CODED 2026-11-16 (T-668): `tools/pancake/turn_pipeline.py` replays the real turn log with the pre-read and the re-warm staged into the whole idle gap (an upper bound): mean first token -14.4% (half the tool response known) to -24.9% (all of it), but the p50 moves -0.7% / -2.8%: the mean is carried by a few long-prompt turns after long gaps, and a gap may be the user's wait. Premise still unshown; no engine switch (a read-ahead of a running tool's output needs the client to stream it, nothing here does).<br><b>Expected:<\/b> TTFT -15% then -30% (exact)", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "queued", "title": "#24 CODED 2026-11-16 (`tools/pancake/stack_select.py init / next / record`, `test_stack_select.py` 4 pass; first r...", "body": "CODED 2026-11-16 (`tools/pancake/stack_select.py init / next / record`, `test_stack_select.py` 4 pass; first real use after the 107-auto confirm results: write WINNERS.json from the confirm PROMOTE arms, then one `next` + chain per step; keeps an arm only at >= +1% mean and no case below -1% over the stack without it, env conflicts skipped). R&D-F stack selection tool (tooling). Gains inside one group do not add (rule 4; the P2c stack lost 20%, T-474), and 2026-11-16 produced 40+ screen PROMOTE arms. Write `tools/pancake/stack_select.py`: from the confirm winners build stacks greedily (add one arm, keep it only if the stack is >= +1% over the previous stack at confirm), write the spec for each step; one stack per tag group (KERNEL, ENGINE, WORKLOAD), then across groups<br><b>Expected:<\/b> turns many small exact wins into one adoptable preset change (exact)", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "notstarted", "title": "#25 R&D-G q36 fast preset (MODEL). Qwen3.6-35B: after confirm and the quality gate, stack `DENSE_MMQ` (long32k +7....", "body": "R&D-G q36 fast preset (MODEL). Qwen3.6-35B: after confirm and the quality gate, stack `DENSE_MMQ` (long32k +7.2%), `Q36_ATT_GROUPED` + `Q36_FA` (long32k +13.5%) and, lossy, `Q36_EXPERTS_USED=7` (all T-615, n=1..2) into `configs/pancake/qwen36-*-fast.json`<br><b>Expected:<\/b> 32K prompt +15-20% on the 35B model (mixed)", "ref": "MOD_PLAN 6"}, {"sec": "Code to write", "status": "notstarted", "title": "#26 R&D-H conversation-tied prediction (WORKLOAD; owner idea 2026-11-16: while a conversation works on the same pr...", "body": "R&D-H conversation-tied prediction (WORKLOAD; owner idea 2026-11-16: while a conversation works on the same problem the same experts are likely needed, so the next experts can be predicted ahead of use). NOT validated: the only evidence is one trace of 4 requests (T-398: a resumed conversation +0.7..+1.0 hit point, bound +1.4..+2.7; domain profile 82.9% vs 81.2%; own-counts oracle +2.9, T-417). Validation first, tier 0, on traces with a conversation id (`conv_trace.py` interleaved same-topic conversations, then recorded real sessions: needs `--dump-routing` on a served run, owner decision): V1 expert-set overlap (top-N per layer, N = the layer's slot budget) between adjacent turns of one conversation vs turns of different conversations; V2 hit-rate lift when the tier is seeded with that conversation's own earlier counts vs the global profile (`replay_seeding.py --requests`); V3 how fast the overlap decays after a topic change (sets the decay and the switch detector); V4 lead time: the share of CPU misses at window t that were in the conversation's predicted set H = 1..8 windows earlier, and with what precision (an ahead-of-use copy pays only above the break-even in item 19). V1-V4 CODED 2026-11-16 (`tools/pancake/tier_laws.py --validate-conv`; law 6 = `conv:w` seeding): results in T-618, the real trace has no repeated conversation, so V1-V4 ran on the SYNTHETIC interleave only (same-conversation adjacent Jaccard 0.363 vs 0.165 other-conversation, V2 +0.12 hit point, V4 H=1 covers 11.3% of misses at 20.0% precision: far below the gates below); real same-conversation traces are still needed. Go on to code (`STRATA_CONV_PREDICT`, issue the predicted experts' copies in the CPU-idle phases, items 6 and 22) only if V2 >= +3 hit points and V4 shows a lead of >= 2 windows at >= 60% precision CHAIN-16a TOOLING CHECKED 2026-11-16 (T-670): `tier_laws.py --turns requests.json --validate-conv` and the conv_trace.py file formats run end to end on a tiny synthetic trace (3 tests); nothing new about the model. Run it on the real trace when chains 16a / 17 deliver `conv.trace` + `conv.requests.json`.<br><b>Expected:<\/b> up to the 4.0.4 bound (about 3% of a window) per T-417 unless V4 finds more (exact (placement))", "ref": "MOD_PLAN 6"}, {"sec": "Defects", "status": "done", "title": "FIXED 2026-11-15 (T-575): the FK-28 dead hook (`Prefill::set_usage`, `usage_`, its count loop) is deleted; the feature i...", "body": "FIXED 2026-11-15 (T-575): the FK-28 dead hook (`Prefill::set_usage`, `usage_`, its count loop) is deleted; the feature is section 6 item 1 (feed `drive.d.usage` from `sp.on_routes`).", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "fix", "title": "DONE 2026-11-16 (A/B in chains 7a and 8a): default path changed without an A/B: Phase 18 item 9 (D7, spec 30 env A/B `ST...", "body": "DONE 2026-11-16 (A/B in chains 7a and 8a): default path changed without an A/B: Phase 18 item 9 (D7, spec 30 env A/B `STRATA_MTP_MULTI_COPY=0`, T-680: default stays); RDNA 9-16 column kernels (D6, spec 104 `STRATA_RDNA_KQ_MAXCOLS=8` vs 16 at confirm, T-699: no difference, 16 stays).", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "CODED 2026-11-16 (T-610), quiet rerun = spec 105 in chain 8: `STRATA_PARK_ASYNC` could not act on HIP (`park_async_on()`...", "body": "CODED 2026-11-16 (T-610), quiet rerun = spec 105 in chain 8: `STRATA_PARK_ASYNC` could not act on HIP (`park_async_on()` false, conversation_snapshot.cpp:231): parks were synchronous inside TTFT. TRIED 2026-11-15 (T-583): enabled as an opt-in env and replayed (spec 63): no gain seen, noisy arm, one stall; inconclusive. CODED 2026-11-16 (T-610): committed as the opt-in (`STRATA_PARK_ASYNC=1` on HIP, hipPointerGetAttributes); quiet rerun = spec 105 in chain 8.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "RESOLVED, no engine change (T-574): the fence theory is not supported; see the ledger row. Original note: Possible fence...", "body": "RESOLVED, no engine change (T-574): the fence theory is not supported; see the ledger row. Original note: Possible fence bug: the staging readers after `wait_flag_ge_or` (verify_kernels.cu ~1619-1650) may lack the `__threadfence_system()` the flag-order test needed (test fix: after the spin and after the store, flag_order_test.cu 26-29; its segfault was a ROCm runtime mismatch, fix `LD_LIBRARY_PATH=/opt/rocm/core-10.0/lib`; failures 57x1 / 101x2 = one device; line 120 prints \"device N ok\" even on failure; run the 4-way matrix with `HIP_VISIBLE_DEVICES=0/1`).", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "FIXED (T-573): sampler greedy rule at all four sites; a NaN temperature was a uniform draw (4 of 4 picks wrong).", "body": "FIXED (T-573): sampler greedy rule at all four sites; a NaN temperature was a uniform draw (4 of 4 picks wrong).", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "FIXED (T-576): `gdn_gate_kernel` computed only the first token (latent, every caller passes 1 token).", "body": "FIXED (T-576): `gdn_gate_kernel` computed only the first token (latent, every caller passes 1 token).", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "FIXED (T-575): upstream #5273 guard (`if (stream_all)`) at the three KVA exits (4252/4396/4527); 5029 is inside the `fus...", "body": "FIXED (T-575): upstream #5273 guard (`if (stream_all)`) at the three KVA exits (4252/4396/4527); 5029 is inside the `fused_l` branch (needs `stream_all`) and 6215 tests `stream_all` itself. Research path only, no test exercises it.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "Phase 17 review R2 / R3: no review text exists (repo, git messages, session transcript searched 2026-11-15). Resolved by...", "body": "Phase 17 review R2 / R3: no review text exists (repo, git messages, session transcript searched 2026-11-15). Resolved by reading the code the names point at: R2 `diverge_at` is not in conv_cache.hpp, it is the field of the PARK_DIVERGENCE_LOG diagnostic (serve/park_divergence.py: first index where the new prompt and the previous prompt + reply differ; no behavior), and the one behavior that uses the divergence point, `STRATA_PARK_TRUNCATE`, tested no difference (spec 62: -1.7% +-40.8%, cold re-reads 0 vs 0). R3 `max_cells` is the ring rule of kv_ring.hpp (`kv_ring_adapt`: cap when cells_needed >= 2 x cap, else floor; the upstream page rounding of cells_needed is deliberately left out); `STRATA_KV_RING_ADAPT` was measured and DROPPED (T-291). Both CLOSED as moot: compared = the code and the two tests; not compared = the original review wording, which does not exist here.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "A37 `IQ_LUT_DUP` (d11a9ca09): code read 2026-11-15: default off (iq_kernels.hpp, 0 = off); stays as an opt-in bench knob...", "body": "A37 `IQ_LUT_DUP` (d11a9ca09): code read 2026-11-15: default off (iq_kernels.hpp, 0 = off); stays as an opt-in bench knob, not reverted.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "parked", "title": "`STRATA_DF2_GATE` is still read (window_rule.hpp, generate.cpp) although upstream retired it: opt-in, off, classified in...", "body": "`STRATA_DF2_GATE` is still read (window_rule.hpp, generate.cpp) although upstream retired it: opt-in, off, classified in disk_env; left in (removing it needs a Mac-side check nobody can run here). PARKED (hardware: needs a Mac), low.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "CODED 2026-11-16 (T-595, off by default, README 9 credit, LEADS B104): `STRATA_PSI_SHED` (Speedy C4, idea from Basalt PR...", "body": "CODED 2026-11-16 (T-595, off by default, README 9 credit, LEADS B104): `STRATA_PSI_SHED` (Speedy C4, idea from Basalt PR #113; Speedy SPEEDY.md / CHANGELOG 0.1.0 / TUNING-HISTORY read 2026-11-15): opt-in `STRATA_PSI_SHED=<avg10 %>`, off by default: under PSI memory pressure the engine drops PARKED CONVERSATIONS; no numbers upstream (test name `memory_pressure_test`, robustness only). Ours has the park half (`STRATA_PSI_PARK_PCT`, skip parking) and no shed half. Port design: `memory_pressure_sheds(&why)` beside `memory_pressure_blocks_parking` (mem_pressure.cpp:297, same probe, threshold from `STRATA_PSI_SHED`), and at each served request start in generate.cpp one `conversations.evict_oldest()` while it is true (the avg10 figure lags, so one entry per request); exact (a cache miss re-reads the prompt, same tokens); disk_env entry Inert like PSI_PARK_PCT; unit test with a fake PSI file (`loader_pressure_begin_with` Paths); credit Speedy and Basalt #113 in README 9 and the findings table.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "CODED 2026-11-16, default off, engine NOT built or run (Windows box; the Linux box runs `ctest fork_bugfix_rules_test co...", "body": "CODED 2026-11-16, default off, engine NOT built or run (Windows box; the Linux box runs `ctest fork_bugfix_rules_test conversation_snapshot_test conversation_disk_env_test` and the pytest): (a) `STRATA_CONV_DISK_WANTS` T-651, (b) `STRATA_CACHE_ROOT_PAST` T-652 (a checkpoint position: needs a cache A/B before any default), (c) `STRATA_WINDOW_EVICT_LONG` T-653, (d) `STRATA_CAPTURE_BEAT` T-654, (e) NOT CODED: already present (`strata_control/childenv.py`, T-655), (f) `STRATA_KEEPALIVE_DATA` T-656 (pytest passed on Windows), (g) `STRATA_DISK_NO_DRAFT` T-657. All correctness-only, no speed spec. Original finding follows. OPEN 2026-11-16 (fork scan, LEADS.md Part H; each exact, read in the fork diff and in our tree, none tested): (a) `park_current_body` disk-only path saves without the `conversations.wants()` check, so a short conversation is written (ElXreno `3da39ce1`; generate.cpp:13776-13780, :17662); (b) the prompt-cache root is taken from the wrong place for turn tokens below `--prompt-cache-root` (ElXreno `00be27a0`; generate.cpp:20664-20669); (c) `evict_window_graph` covers `kWindowMaxT`, not `kVerifyLongT` (ElXreno `c01bb2a4`; verify.cpp:6218); (d) no `progress_beat` after the window-graph capture, so the watchdog can read a long capture as a stall (0FL01 `d3a7502d`; verify.cpp:4462); (e) child processes lack `GGML_NO_BACKTRACE=1` (Damir `3b02be29`); (f) keepalive pings are not sent as data chunks (touch869 `29bbdb4f`; serve/server.py:8757); (g) save / restore without MTP (lorenzoaspesi `f93304f8`, ElXreno `f16edb27`; conversation_state.cpp:701, 723, 807: inert on our preset). Fix each with a unit test, byte-identical otherwise.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "Tools: FIXED (T-577): `night_queue.py` zero-measurement real passes are now failed; `abtest.py` text_check accepts any b...", "body": "Tools: FIXED (T-577): `night_queue.py` zero-measurement real passes are now failed; `abtest.py` text_check accepts any base pass. FIXED (T-597): `bench/quality/set-v2.json` is complete (the T-310 `--fill` output, 0 of 48 without continuation) and is now the `quality_gate.py` default; all `taskgate-*` specs use `bench/tasks/default.json`: left as is on purpose (checked 2026-11-15): default.json is the only set with the 7 tool-call tasks the pending ECAP tool-call gate needs; `repo-history.json` is 150 code-edit tasks only. Point a spec at repo-history only when it is about code-edit quality.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "Item 38 O_DIRECT loader: CLOSED 2026-11-15 by code read: built (184e68e83, expert_source.cpp:852 and 2522, `STRATA_UNBUF...", "body": "Item 38 O_DIRECT loader: CLOSED 2026-11-15 by code read: built (184e68e83, expert_source.cpp:852 and 2522, `STRATA_UNBUFFERED_LOAD`); line 6155 is the fallback when the direct read is refused (buffered read plus the `STRATA_LOAD_DONTNEED` page-cache drop).", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "parked", "title": "Planned but not in code: `STRATA_FORCE_ISA` avx512 / avx-vnni values (item 57): not applicable here (the 5700G is Zen 3,...", "body": "Planned but not in code: `STRATA_FORCE_ISA` avx512 / avx-vnni values (item 57): not applicable here (the 5700G is Zen 3, no AVX-512, no VNNI) and not worth a no-op value; CPU governor setting (item 41): needs root, the owner sets `performance` by hand (see the box notes); `--pool-affinity measure` is a no-op on the 5700G.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "PCIe link, measured 2026-11-15 (T-581, sysfs): the path to the 7900 XT is 00:01.1 (CPU root port) 8.0 GT/s x16, switch 1...", "body": "PCIe link, measured 2026-11-15 (T-581, sysfs): the path to the 7900 XT is 00:01.1 (CPU root port) 8.0 GT/s x16, switch 10:00.0 8.0 GT/s x16, then 16.0 GT/s x16 inside the card: the effective host link is PCIe Gen3 x16 (about 15.8 GB/s), as the plan assumed.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "fix", "title": "OPEN 2026-11-16 (T-630): `STRATA_PF_COMBINE_WRITE=1` (spec 97, opt-in) ends its first served request: the engine reached...", "body": "OPEN 2026-11-16 (T-630): `STRATA_PF_COMBINE_WRITE=1` (spec 97, opt-in) ends its first served request: the engine reached `ready`, logged `reading the prompt: 64 of 71 tokens`, and the client got HTTP 503; abtest died and chain 6 spec 97 exited 1, `hc-gated16` and `swiglu-q8` never ran. No engine log was kept for that arm (only the .out). Rerun the arm alone with its engine log (one-arm spec, like 114a-f) before anything else; `MMQ_LINEAR` (long1k prompt 353 vs 624 tok/s, n=1) and `NW_COLSKIP` (long3k 788 vs 1110) read slower on  the default signal and the default 4096 KiB a phase: the crash is not reproduced by a single-arm run (n=2). So the signal, the late issue and the queue order are not each sufficient causes; spec 88 failed at its sixth arm in one server sequence, so look at what that sequence did before (the five earlier arms' state; spec 95 logged the abtest warning `only 17-19 GiB of free RAM in 2 MiB blocks` against the 33 GiB arena on every arm, spec 88 was not checked). The bases of 114b and 114c ran slow (ORDER EFFECT, -23..-29% base-late), so no speed verdict.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "fix", "title": "OPEN 2026-11-16 (T-602): `STRATA_MMVQ_IL_PLAIN=1` (opt-in) crashes at layer 0 (`an illegal memory access`). Code read (u...", "body": "OPEN 2026-11-16 (T-602): `STRATA_MMVQ_IL_PLAIN=1` (opt-in) crashes at layer 0 (`an illegal memory access`). Code read (unconfirmed static analysis): on gfx1100 the plain-column rows table is all 0, so the projections fall back to native_mmvq; what changes is the HC read: with `q8_il` set, fused_gr.cu skips the RDNA read (`STRATA_GR_RDNA=1` in fast-hip) and the 32-column up kernels for the generic read + `gr_q8_tail`, which writes the interleaved copy. Chain 13 also runs 114f (`STRATA_GR_RDNA=0` alone), 114e (IL_PLAIN with `GR_RDNA=0`) and 114d (IL_PLAIN with `STRATA_MMVQ_IL_CHECK=1`, `AMD_SERIALIZE_KERNEL=3`, `HIP_LAUNCH_BLOCKING=1`: names the faulting kernel). The box agent's `mmvq_il_parity` run (section 5 item 2) stays as planned. RESULT 2026-11-16 (T-649, T-650, and 114d T-678: IL_PLAIN with the check env, serialized launches and `GR_RDNA=1` also ran with no fault, text identical, speed equal to base; no IL line in its logs, so inertness is not excluded): 114f (`GR_RDNA=0` alone) and 114e (IL_PLAIN with `GR_RDNA=0`) both RAN with no fault, both -11..-13% against the early base (the same cost: IL_PLAIN adds about 0); so the generic HC read is not the fault, and the crash needs the RDNA read with `q8_il` (`GR_RDNA=1`). 114d did not name any kernel: nothing faulted.", "ref": "MOD_PLAN 7"}, {"sec": "Defects", "status": "done", "title": "FIXED 2026-11-16 (T-610): status page on the HIP box: GPU name null and backend labelled CUDA (cosmetic); the amdgpu sys...", "body": "FIXED 2026-11-16 (T-610): status page on the HIP box: GPU name null and backend labelled CUDA (cosmetic); the amdgpu sysfs reader (8a9c5bce7) now supplies VRAM, temperature and power; the name comes from the PCI id when product_name is empty (the 7900 XT's is) and the label is HIP when the readings come from the sysfs reader (`backend_label`, display only).", "ref": "MOD_PLAN 7"}, {"sec": "Parked", "status": "parked", "title": "RTX 3060 / CUDA sm_86 only: Speedy sm_86 presets and `HC_Q8=1` (+5.5-6% on 3080s; keep `HC_Q8=0` on HIP), KhaledElzarw s...", "body": "RTX 3060 / CUDA sm_86 only: Speedy sm_86 presets and `HC_Q8=1` (+5.5-6% on 3080s; keep `HC_Q8=0` on HIP), KhaledElzarw sm_86 kernels (`GR_DOWN82/86`, `GR_UP_HYB`, `GR_XN`, `GR_UP_PL`, `GR_D87`, `ACTQ_SKIP`, `GR_RES`, `MMVQ_IL_3090`), F17 `STRATA_FATTN` (in `src/poly/fattn.cu`, needs a CUDA card), `--vram-reserve-mib` 444 (Speedy, 10 GB card), basalt head work beyond `q5k_head.cu`.", "ref": "MOD_PLAN 8"}, {"sec": "Parked", "status": "parked", "title": "Two GPUs (layer split): Speedy `PIPELINE_PENALTIES` / `PW_RES_PATCH` / `ROUTED_STREAM_PP`, ExTV patch 01 (`--prefill-mai...", "body": "Two GPUs (layer split): Speedy `PIPELINE_PENALTIES` / `PW_RES_PATCH` / `ROUTED_STREAM_PP`, ExTV patch 01 (`--prefill-main`, `--kv-resident-later`, `--prefill-main-small`), upstream #3821 #3819 #3648 #3742 #3306 #4549 #4534 #4380 #4522 #859, Phase 12 tensor parallel.", "ref": "MOD_PLAN 8"}, {"sec": "Parked", "status": "parked", "title": "Scope: DeepSeek V4.1 ports (owner: Qwen first); GLM-5.3-Flash / MiniMax-M3.1-Flash (Project Maya, upstream #4319 closed ...", "body": "Scope: DeepSeek V4.1 ports (owner: Qwen first); GLM-5.3-Flash / MiniMax-M3.1-Flash (Project Maya, upstream #4319 <script type="text/plain" id="md"># pancake-strata: plan

A performance fork of [Strata](https://github.com/Niko1221/Strata) for single-user agent serving on one home box.
This file says what is true now, what runs next and what is waiting for a decision. Consolidated on 2026-11-15 from
the old 3,984-line plan and about 200 side documents, after an item-by-item audit against the code, presets, specs and
result archives.

Companion files:
- [TEST_LEDGER.md](TEST_LEDGER.md): every test ever run (699 rows at 2026-11-16 23:30, ids `T-nnn`), with numbers, spec, tier, verdict and
  the archive path; plus the data conflicts found while merging. Cite tests by id.
- [LEADS.md](LEADS.md): every unported idea from forks, upstream PRs, llama.cpp, papers and hardware notes (~600
  leads), with author numbers and whether our tree has it.
- `bench/specs/` (A/B specs), `bench/results/` and `pancake-docs/research/bench/results-*/` (raw evidence),
  `configs/pancake/` (presets), `tools/pancake/` (measurement suite).

## 1. Goal, box and models

Fastest single-user agent serving (long growing prompts, tool calls) with output identical to plain decoding unless a
flag says it is lossy. Speed = decode tok/s (new text and code edits), prompt tok/s at 4K/16K/32K, and time to the
first token of an agent turn after a long conversation.

| | |
|---|---|
| GPU | RX 7900 XT 20 GB, gfx1100, ROCm 10.0 (`/opt/rocm/core-10.0/lib`), hipBLASLt table `tools/hip/gfx1100-hipblaslt-100401.txt` |
| CPU / RAM | Ryzen 7 5700G (Zen 3, AVX2, no AVX-512, no WAITPKG), ~57 GB DDR4 (~33 GB/s; the CPU expert pool is bandwidth-bound) |
| Bus | PCIe 3.0 (forced by the 5700G), ReBAR 32 GB BAR0, IOMMU passthrough, THP madvise |
| Gone | RTX 3060 12 GB removed 2026-11-08: CUDA/sm_86-only items are parked (section 8) |
| Daily model | Qwen3.8-Flash-Next IQ2_XS (GSQ-RCO pack), preset `configs/pancake/flashnext-iq2_xs-fast-hip.json`, `run-pancake.sh` default |
| Opt-in | Flash-Next Q2_0 (`*-q2_0-*-adopted.json`; 134.7-136.1 tok/s, 80.6% top-1 vs Q8_0, T-377; the 15c Q2_0-vs-IQ2_XS redo is DROPPED: owner 2026-11-16, D8, keep IQ2_XS); Qwen3.6-35B-A3B (`src/qwen35` = strata-q36, and `strata-poly`); DeepSeek V4.1-Flash (`src/dsv41`, owner-deferred: Qwen first) |
| Not goals | Qwen3.8-27B dense, NVFP4 / `.basalt` (Blackwell), Vulkan/SYCL/Intel/Mac tuning, another engine as the base (vLLM, SGLang, KTransformers, TensorRT-LLM, LMDeploy, MLC-LLM, ExLlamaV2, PowerInfer, TGI, LightLLM, NanoFlow, DeepSpeed-MII, TensorFold: they keep the model in VRAM or need far more memory) |

Baseline (HEAD 693cdf63d, spec 43, T-392): short 111.5, edit 112.3, longdec10k 91.7 (noisy), longdec32k 102.8 (noisy)
tok/s. Reference points: stock Strata 54.5 vs ours 75.5 on the 3060 (T-216); Strata-rdna3 109-119 and Avalon 95-100
on this card (T-009); window budget short 24.8 ms = 15.9 GPU / 5.2 CPU / 2.2 other, edit 37.4 ms = 15.8 / 17.4 / 2.5 + 1.7 sync;
decode profile top kernels combine_cpu 25.8%, wait_flag 14.8%, rdna_kq 9.0%, expdec_gu 6.8% (spec 40 profile).

### Trend goal (proposed 2026-11-16, targets not claims; owner confirms in D12)

One number set, measured the same way every week: spec `bench/specs/115-trend-weekly.json` (the daily preset against
itself: the base arm is the week's trend point, the base-again arm is that week's noise floor), confirm settings, one
ledger row per run. A target counts as reached only by that run.

| measure | today (2026-11-16) | target 2026-12-14 | target 2027-02-08 | where it must come from |
|---|---|---|---|---|
| decode short, tok/s | 110.9-113.9 (T-612, T-614 bases, n=2) | 120 | 135 | R&D-A tier predictor, R&D-D GPU wait (section 6 items 19, 22) |
| decode edit, tok/s | 155.7 (T-612 base, n=2), 165.3 +-6.2 (T-588) | 175 | 200 | R&D-C window policy, R&D-A (items 21, 19) |
| prompt long1k / long3k / long64k, tok/s | 620 / 1106 / 1980 (T-614, n=1) | 680 / 1150 / 2000 | 750 / 1250 / 2200 | `DQ_FAST` if spec 103 confirms it, R&D-E (item 23) |
| warm agent turn, time to first token | not measured yet (M1, M2, M5 in chain 9) | chain 9 number -15% | -30% | R&D-E warm-turn pipeline (item 23) |
| lossy lane (separate preset, never the daily base) | - | one gated arm >= +10% decode | a `fast-lossy` preset | R&D-B miss budget (item 20) |

Why these sizes: the short window is 24.8 ms with 5.2 ms CPU and 2.2 ms other; halving the CPU part alone is +11.7%.
40.6% of the decode kernel time (combine_cpu 25.8% + wait_flag 14.8%) is the GPU waiting for CPU expert rows, so the
lever is fewer and cheaper misses and work inside the wait, not faster kernels: on 2026-11-16 the kernel-level and
launch-fusion switches screened as noise or losses (T-604, T-612, T-614, T-616), while the three large wins so far were
all policy: the ECAP row gate (edit +41.7%, T-588), the router lookahead (+10%, T-192) and the learned profile (+6.7%,
T-194). Trend rule: R&D time goes first to the track whose budget share is largest; a track is stopped after its
tier-0 (offline) step if the replay shows < 3% of window time to win.

## 2. Rules

Measurement (the full text is in AGENTS.md "Measurement rules"):
1. Paired A B B A runs, run 1 discarded, quiet machine (`abtest.py` waits and refuses beside a running server). Bar:
   >=2% end to end exact, >=3% lossy; TTFT bar >=0.1 s per warm turn or >=2% on long prompts. Screen, then confirm
   (`--block 3 --warmup 1 --outlier robust --reclaim-max 3 --reps 9`). Owner rule since 2026-11-13: promote from 0% up
   at screen, decide at confirm; "test, never judge by reading".
2. Text identity is not an exactness proof (stock-vs-stock greedy noise is 1.2-1.3% of tokens; the base arm gave 6
   hashes in 6 runs). Lossy arms need token forcing (`quality_gate.py`, 20 requests x 300 tokens, 2 stock arms; it
   rejects only large deviations) and then the task gate (`task_gate.py`: LiveCodeBench subset + BFCL v4 multi-turn +
   own-repo grading) to choose between close variants.
3. Run `python tools/pancake/spec_lint.py` before any A/B: an arm key the fork does not read is a no-op.
4. Gains inside one substitute group do not add; price an idea against the window budget first (edits are a plain sum,

Test tiers (`abtest.py --tier`; answer each item at the cheapest tier that can):
- 0 offline: replays and byte counts (cache sims, `tools/pancake/trace/tail_replay.py`, `replay_turns.py --dry-run`); no GPU.
- 1 screen: one A B pass, short + edit, 2 requests per case per server; promote from 0% up (owner rule 2026-11-13,
  code 41f4f6231), drop if any case < -3%; decide at confirm (bar >= 2% exact, >= 3% lossy).
  Spec key `"prefill": true` keeps the `long*` cases (one cold request each, judged on prompt tok/s). ~2-3 min/arm.
  A screen promote is only a hint: n=2 gave intervals of +-100..+450 tok/s.
  `abtest.py --drift-check` (or `"drift_check": true` in the spec; coded 2026-11-16, in the 114a-f / 116 / 30 / 33 / 34 / 18-f22 / 108 / 109 / 112 specs): the base arm runs a second time
  at the end (arm `base-late`), every arm is judged against the mean of both base runs and the verdict block prints the base drift; above 5% it says ORDER EFFECT
  (a screen runs the base first: specs 83 and 93 had a base 11-40% low and every arm looked like a gain, T-606, T-622). Off by default.
- 2 confirm: A B B A with early stop (every arm/case decided or interval < 1.5% of base). For a decision use rule 1's
  flags with `--no-early-stop` and the same tier for every arm. Exact items need 12+ pairs to prove 2% at a paired SD of 1.5%.
- 3 rigorous (lossy, preset-default change, text differs from base, long-context claim): confirm + `quality_gate.py` +
  `task_gate.py SPEC.json --out bench/results/<day>-<name>` (`--dry-run` checks spec and task set without a server;
  base runs twice as the drift check; BETTER/PASS/INCONCLUSIVE/REJECT; INCONCLUSIVE -> `--reps 10-20` or more tasks).
- Evidence order: `ctest -L cpu`/`-L gpu` and parity -> kernel level (`expdec_bench`, `q2_rows_bench`, rocprof; kernel
  gain x window share >= 2% before end to end) -> screen -> confirm -> gates -> `python3 tools/pancake/promote.py <items.json>`.
- Cases: `long` 11.7K, `long32k`/`long64k` ~32000/~64000 tokens of `src/**/*.cpp`, 32 new tokens, each opened by a
  unique `[run <nonce>-<n>]` line (always cold, hash not compared); 128K is not an abtest case.
- Before a batch: `tools/pancake/os_tune.sh` (abtest warns below 20 GiB free in 2 MiB blocks; the arena locks 33 GiB;
  fix with `sudo tools/pancake/os_tune.sh compact|install`); CPU 3.9-4.1 GHz in run telemetry (slow runs sit at
  3.4-3.7 GHz; `sudo tools/pancake/os_tune.sh cpu-install`); engine on 8080 stopped; `pgrep -f test_phase.sh`.
  A server dying before ready is retried once, then the batch aborts with the free-block count.
- One spec per area with all its env-only arms. One decision per item: a "no difference" confirm -> opt-in or removed,
  retest only after a code change. A switch that never logged "acted" voids its arm. Arena vs mmap tiers differ ~8%,
  never mix them. Back to back: `tools/pancake/queue_run.sh OUTDIR SPEC[:abtest args] ...` (`-n` previews).
- No gain: at most 2-3 attempts. Read the `decode timing` line + `gpu_profile.py`; check the path acts (log line) and is
  not masked; tune with `tools/pancake/sweep.py`; then keep, opt-in or remove.

## 10. Architecture facts worth knowing before touching the code

- Chunk plan: the serve loop cuts at root_at (first `<|im_start|>` after token 0 if >= `--prompt-cache-root` 2048; a
  smaller system prompt is re-read on purpose, ~0.3 s), turn_at (last `<|im_start|>`) and n-1; `CACHE_MESSAGE` /
  `TOOL_BOUNDARY` and `pin=` add cuts; <= `--short-read` 64 tokens go through decode windows; chunk = min(prefill_chunk,
  segment rounded up to 256) via lend -> planned_chunk -> equal_chunk -> request_chunk (generate.cpp ~997, ~1009,
  ~10355; loop in `Prefill::run_impl`; `STRATA_TRACE` prints `prompt chunk` / `lent`). The loan lasts until the segment
  ends.
- Auto chunk: largest 256-multiple with loan <= 90% of slots (85% if less pinned), 128 left; AUTO_MAX clamps
  32768/16384/8192; loan at 32K = 9,413/10,733 slots, 12.59/14.37 GiB, ~5% resident (generate.cpp ~3938).
- With CPU share armed, `stream_all_min` = `CPU_SHARE_MAX` 4096: T >= 4096 streams (192-slot ring, copies overlap
  attention); T < 4096 is staged (per-layer sync on routing, 8-slot ring, 32 with MMQ groups). A warm turn is one staged
  chunk and the copy engine idles through attention (the reason for PF_AHEAD). CPU share only takes experts with <= 8
  tokens (MAXT, expert.hpp:143); share=auto keeps running means (w 0.25), clamp(g/(c+g), 0.05, 0.9), needs 3 ratios,
  probes every 29th layer, HIP off except a single gfx12.
- EQUAL_TAIL (prefill_plan.hpp:182, `_MIN` 256) is skipped when evened chunks would be < 8,192 (kEqualTailMinChunk, :172;
  upstream measured 25 tokens past 8,192 read 25% slower when evened) or below the staged limit; `PREFILL_EQUAL` (#693)
  evens only when the last chunk would stream anyway; EQUAL_TAIL wins on a staged tail.
- Checkpoints: `--prompt-cache 6` (generate.cpp ~961), ~113-118 MiB each, at the turn boundary and chunk ends >= 16,384
  apart; restore only from a prefix (GDN state). Parked conversations: 1,280-6,656 MiB auto (usually 4,352), 4 slots;
  snapshot = 111 MiB + 14.9 KiB/token + 113 MiB per checkpoint. Refill is one wait (~1 s for a 12.6 GiB loan;
  `STRATA_REFILL_BLOCKING` keeps the old form; trace prints `refilled ... in <ms>`).
- Prefix reuse breaks on: client edits; system prompt or tool list change (tools render in the system block -> full
  re-read); effort; a re-render that differs; dropped reasoning (re-renders only the last turn); eviction; loop-guard
  collapse.
- Floor model: 48 layers x 512 experts, top-10, 1.4 MB/expert, 44% resident, routed share 1-exp(-10n/512), floor ~0.67 s,
  PCIe-bound. QSA indexer cost grows n^2, attention ~2,051 cells/query; KV staging ~1,056 B/token/layer over 12 QSA layers.
- Hot path hygiene: no per-window getenv (c44b1ad7b, 7c0f03228), no hot-path allocations, no decode file I/O; the 4
  dispatch loops in `expert_pool_dispatch_multi` are linear (`first_of`, `miss`, `next_of`, `q_of`; greedy check owed).

- BFLA (`src/kernels/cuda/bfla.cu`, `include/strata/kernels/bfla.hpp`, q36_engine.cu; arXiv 2605.12193, Apache-2.0
  reference read, not copied). Engine: qwen35 only (10 dense gated attention layers, H 16, HKV 2, D 256). It replaces the
  path that materialises FP32 scores over the whole prefix (FP16 K/V, hipBLAS QK^T, causal softmax to FP16, PV GEMM),
  which is quadratic in FLOPs and score traffic (~12 B/score). Not on Flash-Next: QSA already reads 2,051 cells/query;
  a V/3 budget reads ~16x more at 128K (tile-shared selection: T-098, dropped).
  Kernels (HIP wave32 gfx11; other builds return false):
  `features`: phi = N(mean over G heads of N(q_h)), adjacent pairs summed to 128, N again; mu = block mean over K.
  FP32, no FP8. Hadamard dropped (relu(phi.mu) is rotation-invariant). mu recomputed over the prefix every chunk
  (~1/4 of `k_kv_f16`), so a restored cache is never stale.
  `select`: one workgroup per (128/G-token tile, KV head); online LSE of relu(phi.mu)/sqrt(128); budget
  k = ceil(min(V, max(Kmin, min(Kmax, ceil(eta V))))/64). Mandatory 2 sink + own + 4 local blocks count in the quota.
  32-step bisection for the k-th score, ties to the smaller id, deterministic ascending list.
  `attn`: 4 waves per (64 rows, KV head), 16 rows x 256 dims per wave; Q in LDS once; 16-key steps, V transposed in LDS;
  16 WMMAs each for S and PV (O = 128 VGPRs/lane); causal mask only on diagonal blocks; exp2 online softmax in FP32;
  P to FP16 via a per-wave LDS tile; FP32 out, gate stays `k_gate_mul`. Not bitwise vs the GEMM path.
  gfx11 facts: `v_wmma_f32_16x16x16_f16` A lane l = row l%16 (16-31 repeat), B = column l%16, D lane l = D[2i+l/16][l%16];
  64 KiB LDS/workgroup; no FP8 matrix ops, no TMA/wgmma; every wave does the same work.
  Follows the paper's Ratio-K, not the published code (keep-mass 0.99, 256-blocks, 8 local).
  Switches: `STRATA_BFLA_DENSE=1` (exact), `_SPARSE=1` (lossy, wins if both), `_MIN` 32768, `_ETA` 1/3, `_KMIN` 2048,

  var secSel = document.getElementById('sec-sel');
  Array.from(new Set(D.items.map(function (i) { return i.sec; }))).forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s; secSel.appendChild(o); });
  var qItems = document.getElementById('q-items');

  function renderItems() {
    var q = qItems.value.trim().toLowerCase(), sec = secSel.value, out = document.getElementById('items'), n = 0;
    out.innerHTML = '';
    D.items.forEach(function (i) {
      if (activeSt.size && !activeSt.has(i.status)) return;
      if (sec && i.sec !== sec) return;
      if (q && (i.title + ' ' + i.body + ' ' + i.sec).toLowerCase().indexOf(q) < 0) return;
      n++;
      var d = document.createElement('details'); d.className = 'item'; d.style.setProperty('--c', stColor[i.status]);
      d.innerHTML = '<summary><span class="st">' + stName[i.status] + '</span><span class="ttl">' + tag(inl(i.title)) + '</span><span class="sec">' + i.sec + ' &middot; ' + i.ref + '</span></summary><div class="body">' + tag(inl(i.body)) + '</div>';
      out.appendChild(d);
    });
    if (!n) out.innerHTML = '<div class="empty">No plan items match these filters.</div>';
    document.getElementById('n-items').textContent = n + ' of ' + D.items.length + ' items';
  }
  secSel.onchange = renderItems; qItems.oninput = renderItems;

  // tests
  var vKey = function (v) { return (v || '').split(/[ (]/)[0].toUpperCase(); };
  var vCount = {}; D.tests.forEach(function (t) { var k = vKey(t.verdict); vCount[k] = (vCount[k] || 0) + 1; });
  var vColor = { ADOPTED: '--s-done', PASS: '--s-done', DROPPED: '--s-dropped', FAIL: '--s-fix', ABORTED: '--s-fix', 'OPEN-NO-DECISION': '--s-waiting', 'PROMOTED-CONFIRM-PENDING': '--s-progress', INFO: '--s-notstarted' };
  var activeV = new Set(), vEl = document.getElementById('v-chips');
  Object.keys(vCount).sort(function (a, b) { return vCount[b] - vCount[a]; }).forEach(function (k) {
    var c = document.createElement('button'); c.className = 'fchip'; c.dataset.v = k; c.setAttribute('aria-pressed', 'false');
    c.style.setProperty('--c', 'var(' + (vColor[k] || '--muted') + ')');
    c.innerHTML = '<i></i>' + k + ' <small>' + vCount[k] + '</small>';
    c.onclick = function () { activeV.has(k) ? activeV.delete(k) : activeV.add(k); c.setAttribute('aria-pressed', activeV.has(k) ? 'true' : 'false'); renderTests(); };
    vEl.appendChild(c);
  });
  var areaSel = document.getElementById('area-sel');
  Array.from(new Set(D.tests.map(function (t) { return t.area; }))).forEach(function (a) { var o = document.createElement('option'); o.value = a; o.textContent = a; areaSel.appendChild(o); });
  var qTests = document.getElementById('q-tests');
  function esc(s) { return (s || '').replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function renderTests() {
    var q = qTests.value.trim().toLowerCase(), a = areaSel.value, rows = [], n = 0;
    D.tests.forEach(function (t) {
      var k = vKey(t.verdict);
      if (activeV.size && !activeV.has(k)) return;
      if (a && t.area !== a) return;
      if (q && (t.id + ' ' + t.item + ' ' + t.test + ' ' + t.result + ' ' + t.verdict + ' ' + t.archive).toLowerCase().indexOf(q) < 0) return;
      n++;
      rows.push('<tr><td class="id">' + t.id + '</td><td>' + esc(t.date) + '</td><td class="v" style="color:var(' + (vColor[k] || '--muted') + ')">' + esc(t.verdict) + '</td><td class="item-c">' + inl(t.item) + '<br><small style="color:var(--muted)">' + inl(t.test) + '</small></td><td class="res">' + inl(t.result) + '</td><td>' + esc(t.tier) + '</td><td>' + esc(t.exact) + '</td><td>' + esc(t.area) + '</td><td class="arch">' + esc(t.archive) + '</td></tr>');
    });
    document.getElementById('tests').innerHTML = rows.join('') || '<tr><td colspan="9" class="empty">No tests match these filters.</td></tr>';
    document.getElementById('n-tests').textContent = n + ' of ' + D.tests.length + ' tests';
  }
  areaSel.onchange = renderTests; qTests.oninput = renderTests;

  // full plan
  var planEl = document.getElementById('plan');
  planEl.innerHTML = tag(marked.parse(document.getElementById('md').textContent, { gfm: true }));
  planEl.querySelectorAll('table').forEach(function (t) { var w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });

  // tabs
  function showView(v) {
    ['items', 'tests', 'plan'].forEach(function (x) {
      document.getElementById('v-' + x).hidden = x !== v;
      document.getElementById('tab-' + x).setAttribute('aria-selected', x === v ? 'true' : 'false');
    });
    store('pancake-view', v);
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { showView(b.dataset.view); }; });
  var start = location.hash === '#tests' ? 'tests' : location.hash === '#plan' ? 'plan' : (store('pancake-view') || 'items');
  renderItems(); renderTests(); showView(['items', 'tests', 'plan'].indexOf(start) >= 0 ? start : 'items');
})();
</script>
