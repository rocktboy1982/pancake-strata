* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14.5px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 2px solid var(--fg); padding-bottom: 12px; }
header.top h1 { font: 700 clamp(24px, 4vw, 34px)/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }

.meta { font: 12.5px/1.5 var(--font-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

.count b { font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.count span { font-size: 12.5px; color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

.shown { font-size: 12.5px; color: var(--muted); }
.list { display: grid; gap: 8px; }
.item { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 6px; }
.item summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; }
.item summary::-webkit-details-marker { display: none; }

.st { font: 600 11px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.ttl { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.sec { font-size: 12px; color: var(--muted); white-space: nowrap; }
.body { padding: 0 14px 12px 14px; color: var(--fg); overflow-wrap: anywhere; border-top: 1px dashed var(--line); padding-top: 10px; }
.body p { margin: 0 0 6px; }
code { font: 0.88em/1.4 var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.tid { font: 500 0.85em/1 var(--font-mono); color: var(--accent); background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--line); }
th { font: 600 11.5px/1.3 var(--font-body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--code-bg); position: sticky; top: 0; white-space: nowrap; }
td.id { font-family: var(--font-mono); white-space: nowrap; color: var(--accent); }
td.v { white-space: nowrap; font-weight: 600; font-size: 11.5px; letter-spacing: 0.04em; }
td.res { min-width: 320px; }
td.item-c { min-width: 200px; }
td.arch { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); min-width: 180px; overflow-wrap: anywhere; }
.plan { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 22px 24px; min-width: 0; }
.plan h1 { display: none; }
.plan h2 { font: 600 21px/1.25 var(--font-display); margin: 30px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.plan h2:first-of-type { border-top: none; }
.plan p, .plan li { max-width: 82ch; }
.plan .tbl { overflow-x: auto; margin: 12px 0; }

.plan pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.plan pre code { background: none; padding: 0; overflow-wrap: normal; }
.empty { padding: 24px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 6px; }
@media (max-width: 640px) {

<script type="text/plain" id="md"># pancake-strata: plan

A performance fork of [Strata](https://github.com/Niko1221/Strata) for single-user agent serving on one home box.
This file says what is true now, what runs next and what is waiting for a decision. Consolidated on 2026-11-15 from
the old 3,984-line plan and about 200 side documents, after an item-by-item audit against the code, presets, specs and
result archives.

Companion files:
- [TEST_LEDGER.md](TEST_LEDGER.md): every test ever run (537+ rows, ids `T-nnn`), with numbers, spec, tier, verdict and
  the archive path; plus the data conflicts found while merging. Cite tests by id.
- [LEADS.md](LEADS.md): every unported idea from forks, upstream PRs, llama.cpp, papers and hardware notes (~600
  leads), with author numbers and whether our tree has it.
- `bench/specs/` (A/B specs), `bench/results/` and `pancake-docs/research/bench/results-*/` (raw evidence),
  `configs/pancake/` (presets), `tools/pancake/` (measurement suite).

## 1. Goal, box and models

Fastest single-user agent serving (long growing prompts, tool calls) with output identical to plain decoding unless a
flag says it is lossy. Speed = decode tok/s (new text and code edits), prompt tok/s at 4K/16K/32K, and time to the
first token of an agent turn after a long conversation.

| | |
|---|---|
| GPU | RX 7900 XT 20 GB, gfx1100, ROCm 10.0 (`/opt/rocm/core-10.0/lib`), hipBLASLt table `tools/hip/gfx1100-hipblaslt-100401.txt` |
| CPU / RAM | Ryzen 7 5700G (Zen 3, AVX2, no AVX-512, no WAITPKG), ~57 GB DDR4 (~33 GB/s; the CPU expert pool is bandwidth-bound) |
| Bus | PCIe 3.0 (forced by the 5700G), ReBAR 32 GB BAR0, IOMMU passthrough, THP madvise |
| Gone | RTX 3060 12 GB removed 2026-11-08: CUDA/sm_86-only items are parked (section 8) |
| Daily model | Qwen3.8-Flash-Next IQ2_XS (GSQ-RCO pack), preset `configs/pancake/flashnext-iq2_xs-fast-hip.json`, `run-pancake.sh` default |
| Opt-in | Flash-Next Q2_0 (`*-q2_0-*-adopted.json`; 134.7-136.1 tok/s, 80.6% top-1 vs Q8_0, T-377; the 15c Q2_0-vs-IQ2_XS redo is still open); Qwen3.6-35B-A3B (`src/qwen35` = strata-q36, and `strata-poly`); DeepSeek V4.1-Flash (`src/dsv41`, owner-deferred: Qwen first) |
| Not goals | Qwen3.8-27B dense, NVFP4 / `.basalt` (Blackwell), Vulkan/SYCL/Intel/Mac tuning, another engine as the base (vLLM, SGLang, KTransformers, TensorRT-LLM, LMDeploy, MLC-LLM, ExLlamaV2, PowerInfer, TGI, LightLLM, NanoFlow, DeepSpeed-MII, TensorFold: they keep the model in VRAM or need far more memory) |

Baseline (HEAD 693cdf63d, spec 43, T-392): short 111.5, edit 112.3, longdec10k 91.7 (noisy), longdec32k 102.8 (noisy)
tok/s. Reference points: stock Strata 54.5 vs ours 75.5 on the 3060 (T-216); Strata-rdna3 109-119 and Avalon 95-100
on this card (T-009); window budget short 24.8 ms = 15.9 GPU / 5.2 CPU / 2.2 other, edit 37.4 ms = 15.8 / 17.4 / 2.5 + 1.7 sync;
decode profile top kernels combine_cpu 25.8%, wait_flag 14.8%, rdna_kq 9.0%, expdec_gu 6.8% (spec 40 profile).

## 2. Rules

Measurement (the full text is in AGENTS.md "Measurement rules"):
1. Paired A B B A runs, run 1 discarded, quiet machine (`abtest.py` waits and refuses beside a running server). Bar:
   >=2% end to end exact, >=3% lossy; TTFT bar >=0.1 s per warm turn or >=2% on long prompts. Screen, then confirm
   (`--block 3 --warmup 1 --outlier robust --reclaim-max 3 --reps 9`). Owner rule since 2026-11-13: promote from 0% up
   at screen, decide at confirm; "test, never judge by reading".
2. Text identity is not an exactness proof (stock-vs-stock greedy noise is 1.2-1.3% of tokens; the base arm gave 6
   hashes in 6 runs). Lossy arms need token forcing (`quality_gate.py`, 20 requests x 300 tokens, 2 stock arms; it
   rejects only large deviations) and then the task gate (`task_gate.py`: LiveCodeBench subset + BFCL v4 multi-turn +
   own-repo grading) to choose between close variants.
3. Run `python tools/pancake/spec_lint.py` before any A/B: an arm key the fork does not read is a no-op.
4. Gains inside one substitute group do not add; price an idea against the window budget first (edits are a plain sum,
   so a small exact item caps at a few %). Re-measure fork claims here: Speedy's +22-33% on 3080s was noise..+9% here.
5. Every lead is ported and measured (owner, 2026-11-15; AGENTS.md rule 8): no lead is dropped by reasoning, only by a
   measurement. Three outcomes only: adopted (numbers in the commit), coded opt-in, not adopted (evidence + what would reopen it).
   Every test goes into TEST_LEDGER.md; nothing is dropped silently.

Code:
6. New features are opt-in; the default path stays byte-identical, and the commit says how that was checked. A default
   changes only after a paired measurement. Every new `STRATA_*` name is classified in
   `src/core/conversation_disk_env.def` (chunk-geometry switches are KeyIfSet in the disk key).
7. HIP is the benchmark platform; a CUDA-only change must not break HIP. Official model files + SHA-256 only;
   `presence_penalty=0`; no `STRATA_AUTO_PIN` for Qwen; `ROUTE_TAIL_SKIP=7` only by owner decision.
8. Credit every adopted idea in README section 9 in the same commit (fork, commit, author numbers).
9. Develop by day, run the GPU queue at night (`tools/pancake/night_queue.py`, `--dry-run` first).
10. Linux box repo on an ntfs3 disk (D): `git config checkout.workers 1`; no `reset --hard`, full checkouts or new
    worktrees there; merge only in the existing worktree.

- 0 offline: replays and byte counts (cache sims, `tools/pancake/trace/tail_replay.py`, `replay_turns.py --dry-run`); no GPU.

## 10. Architecture facts worth knowing before touching the code

- Chunk plan: the serve loop cuts at root_at (first `<|im_start|>` after token 0 if >= `--prompt-cache-root` 2048; a
  smaller system prompt is re-read on purpose, ~0.3 s), turn_at (last `<|im_start|>`) and n-1; `CACHE_MESSAGE` /
  `TOOL_BOUNDARY` and `pin=` add cuts; <= `--short-read` 64 tokens go through decode windows; chunk = min(prefill_chunk,
  segment rounded up to 256) via lend -> planned_chunk -> equal_chunk -> request_chunk (generate.cpp ~997, ~1009,
  ~10355; loop in `Prefill::run_impl`; `STRATA_TRACE` prints `prompt chunk` / `lent`). The loan lasts until the segment
  ends.
- Auto chunk: largest 256-multiple with loan <= 90% of slots (85% if less pinned), 128 left; AUTO_MAX clamps
  32768/16384/8192; loan at 32K = 9,413/10,733 slots, 12.59/14.37 GiB, ~5% resident (generate.cpp ~3938).
- With CPU share armed, `stream_all_min` = `CPU_SHARE_MAX` 4096: T >= 4096 streams (192-slot ring, copies overlap
  attention); T < 4096 is staged (per-layer sync on routing, 8-slot ring, 32 with MMQ groups). A warm turn is one staged
  chunk and the copy engine idles through attention (the reason for PF_AHEAD). CPU share only takes experts with <= 8
  tokens (MAXT, expert.hpp:143); share=auto keeps running means (w 0.25), clamp(g/(c+g), 0.05, 0.9), needs 3 ratios,
  probes every 29th layer, HIP off except a single gfx12.
- EQUAL_TAIL (prefill_plan.hpp:182, `_MIN` 256) is skipped when evened chunks would be < 8,192 (kEqualTailMinChunk, :172;
  upstream measured 25 tokens past 8,192 read 25% slower when evened) or below the staged limit; `PREFILL_EQUAL` (#693)

  path that materialises FP32 scores over the whole prefix (FP16 K/V, hipBLAS QK^T, causal softmax to FP16, PV GEMM),
  which is quadratic in FLOPs and score traffic (~12 B/score). Not on Flash-Next: QSA already reads 2,051 cells/query;
  a V/3 budget reads ~16x more at 128K (tile-shared selection: T-098, dropped).
  Kernels (HIP wave32 gfx11; other builds return false):
  `features`: phi = N(mean over G heads of N(q_h)), adjacent pairs summed to 128, N again; mu = block mean over K.
  FP32, no FP8. Hadamard dropped (relu(phi.mu) is rotation-invariant). mu recomputed over the prefix every chunk
  (~1/4 of `k_kv_f16`), so a restored cache is never stale.
  `select`: one workgroup per (128/G-token tile, KV head); online LSE of relu(phi.mu)/sqrt(128); budget
  k = ceil(min(V, max(Kmin, min(Kmax, ceil(eta V))))/64). Mandatory 2 sink + own + 4 local blocks count in the quota.
  32-step bisection for the k-th score, ties to the smaller id, deterministic ascending list.
  `attn`: 4 waves per (64 rows, KV head), 16 rows x 256 dims per wave; Q in LDS once; 16-key steps, V transposed in LDS;
  16 WMMAs each for S and PV (O = 128 VGPRs/lane); causal mask only on diagonal blocks; exp2 online softmax in FP32;

<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var ST = [
    ['done', 'Done / adopted', '--s-done'], ['progress', 'In progress', '--s-progress'], ['queued', 'Queued (coded, not measured)', '--s-queued'],
    ['notstarted', 'Code to write', '--s-notstarted'], ['waiting', 'Waiting for owner', '--s-waiting'], ['fix', 'Fix needed', '--s-fix'],
    ['parked', 'Parked', '--s-parked'], ['dropped', 'Dropped (do not repeat)', '--s-dropped']
  ];
  var stName = {}, stColor = {};
  ST.forEach(function (s) { stName[s[0]] = s[1]; stColor[s[0]] = 'var(' + s[2] + ')'; });
  function inl(s) { try { return marked.parseInline(s || ''); } catch (e) { return s; } }
  function tag(html) { return html.replace(/\b(T-\d{3}(?:\.\.T-\d{3})?)\b/g, '<span class="tid">$1</span>'); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // counts + status chips
  var counts = {}; D.items.forEach(function (i) { counts[i.status] = (counts[i.status] || 0) + 1; });
  var activeSt = new Set();
  var cEl = document.getElementById('counts'), chipEl = document.getElementById('st-chips');
  ST.forEach(function (s) {
    if (!counts[s[0]]) return;
    var b = document.createElement('button'); b.className = 'count'; b.style.setProperty('--c', stColor[s[0]]);
    b.innerHTML = '<b style="color:' + stColor[s[0]] + '">' + counts[s[0]] + '</b><span>' + s[1] + '</span>';
    b.onclick = function () { activeSt = new Set([s[0]]); syncChips(); showView('items'); renderItems(); };
    cEl.appendChild(b);
    var c = document.createElement('button'); c.className = 'fchip'; c.dataset.st = s[0]; c.style.setProperty('--c', stColor[s[0]]);
    c.setAttribute('aria-pressed', 'false'); c.innerHTML = '<i></i>' + s[1] + ' <small>' + counts[s[0]] + '</small>';
    c.onclick = function () { activeSt.has(s[0]) ? activeSt.delete(s[0]) : activeSt.add(s[0]); syncChips(); renderItems(); };
    chipEl.appendChild(c);
  });
  function syncChips() { chipEl.querySelectorAll('.fchip').forEach(function (c) { c.setAttribute('aria-pressed', activeSt.has(c.dataset.st) ? 'true' : 'false'); }); }

  var secSel = document.getElementById('sec-sel');
  Array.from(new Set(D.items.map(function (i) { return i.sec; }))).forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s; secSel.appendChild(o); });
  var qItems = document.getElementById('q-items');

  function renderItems() {
    var q = qItems.value.trim().toLowerCase(), sec = secSel.value, out = document.getElementById('items'), n = 0;
    out.innerHTML = '';
    D.items.forEach(function (i) {
      if (activeSt.size && !activeSt.has(i.status)) return;
      if (sec && i.sec !== sec) return;
      if (q && (i.title + ' ' + i.body + ' ' + i.sec).toLowerCase().indexOf(q) < 0) return;
      n++;
      var d = document.createElement('details'); d.className = 'item'; d.style.setProperty('--c', stColor[i.status]);
      d.innerHTML = '<summary><span class="st">' + stName[i.status] + '</span><span class="ttl">' + tag(inl(i.title)) + '</span><span class="sec">' + i.sec + ' &middot; ' + i.ref + '</span></summary><div class="body">' + tag(inl(i.body)) + '</div>';
      out.appendChild(d);
    });
    if (!n) out.innerHTML = '<div class="empty">No plan items match these filters.</div>';
    document.getElementById('n-items').textContent = n + ' of ' + D.items.length + ' items';
  }
  secSel.onchange = renderItems; qItems.oninput = renderItems;

  // tests
  var vKey = function (v) { return (v || '').split(/[ (]/)[0].toUpperCase(); };
  var vCount = {}; D.tests.forEach(function (t) { var k = vKey(t.verdict); vCount[k] = (vCount[k] || 0) + 1; });
  var vColor = { ADOPTED: '--s-done', PASS: '--s-done', DROPPED: '--s-dropped', FAIL: '--s-fix', ABORTED: '--s-fix', 'OPEN-NO-DECISION': '--s-waiting', 'PROMOTED-CONFIRM-PENDING': '--s-progress', INFO: '--s-notstarted' };
  var activeV = new Set(), vEl = document.getElementById('v-chips');
  Object.keys(vCount).sort(function (a, b) { return vCount[b] - vCount[a]; }).forEach(function (k) {
    var c = document.createElement('button'); c.className = 'fchip'; c.dataset.v = k; c.setAttribute('aria-pressed', 'false');
    c.style.setProperty('--c', 'var(' + (vColor[k] || '--muted') + ')');
    c.innerHTML = '<i></i>' + k + ' <small>' + vCount[k] + '</small>';
    c.onclick = function () { activeV.has(k) ? activeV.delete(k) : activeV.add(k); c.setAttribute('aria-pressed', activeV.has(k) ? 'true' : 'false'); renderTests(); };
    vEl.appendChild(c);
  });
  var areaSel = document.getElementById('area-sel');
  Array.from(new Set(D.tests.map(function (t) { return t.area; }))).forEach(function (a) { var o = document.createElement('option'); o.value = a; o.textContent = a; areaSel.appendChild(o); });
  var qTests = document.getElementById('q-tests');
  function esc(s) { return (s || '').replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function renderTests() {
    var q = qTests.value.trim().toLowerCase(), a = areaSel.value, rows = [], n = 0;
    D.tests.forEach(function (t) {
      var k = vKey(t.verdict);
      if (activeV.size && !activeV.has(k)) return;
      if (a && t.area !== a) return;
      if (q && (t.id + ' ' + t.item + ' ' + t.test + ' ' + t.result + ' ' + t.verdict + ' ' + t.archive).toLowerCase().indexOf(q) < 0) return;
      n++;
      rows.push('<tr><td class="id">' + t.id + '</td><td>' + esc(t.date) + '</td><td class="v" style="color:var(' + (vColor[k] || '--muted') + ')">' + esc(t.verdict) + '</td><td class="item-c">' + inl(t.item) + '<br><small style="color:var(--muted)">' + inl(t.test) + '</small></td><td class="res">' + inl(t.result) + '</td><td>' + esc(t.tier) + '</td><td>' + esc(t.exact) + '</td><td>' + esc(t.area) + '</td><td class="arch">' + esc(t.archive) + '</td></tr>');
    });
    document.getElementById('tests').innerHTML = rows.join('') || '<tr><td colspan="9" class="empty">No tests match these filters.</td></tr>';
    document.getElementById('n-tests').textContent = n + ' of ' + D.tests.length + ' tests';
  }
  areaSel.onchange = renderTests; qTests.oninput = renderTests;

  // full plan
  var planEl = document.getElementById('plan');
  planEl.innerHTML = tag(marked.parse(document.getElementById('md').textContent, { gfm: true }));
  planEl.querySelectorAll('table').forEach(function (t) { var w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });

  // tabs
  function showView(v) {
    ['items', 'tests', 'plan'].forEach(function (x) {
      document.getElementById('v-' + x).hidden = x !== v;
      document.getElementById('tab-' + x).setAttribute('aria-selected', x === v ? 'true' : 'false');
    });
    store('pancake-view', v);
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { showView(b.dataset.view); }; });
  var start = location.hash === '#tests' ? 'tests' : location.hash === '#plan' ? 'plan' : (store('pancake-view') || 'items');
  renderItems(); renderTests(); showView(['items', 'tests', 'plan'].indexOf(start) >= 0 ? start : 'items');
})();
